<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Open with Command Space, browse with Tab, go with Return">
<title>Open with Command Space, browse with Tab, go with Return</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}.mono{font-family:SFMono-Regular,Consolas,monospace}</style>
<rect width="1200" height="240" rx="24" fill="#10121B"/>
<rect x="30" y="24" width="360" height="192" rx="16" fill="#161925" stroke="#282D3D"/><rect x="55" y="48" width="150" height="49" rx="8" fill="#222737" stroke="#62628A"/><text x="74" y="80" font-size="22" fill="#FFC24B" font-weight="650" class="mono">⌘ SPACE</text><text x="55" y="139" font-size="25" fill="#EDE6D6" font-weight="650" class="">Open</text><text x="55" y="178" font-size="16" fill="#A0A9BF" font-weight="500" class="">A shortcut to your next thing.</text><rect x="420" y="24" width="360" height="192" rx="16" fill="#161925" stroke="#282D3D"/><rect x="445" y="48" width="150" height="49" rx="8" fill="#222737" stroke="#62628A"/><text x="464" y="80" font-size="22" fill="#FFC24B" font-weight="650" class="mono">TAB</text><text x="445" y="139" font-size="25" fill="#EDE6D6" font-weight="650" class="">Browse</text><text x="445" y="178" font-size="16" fill="#A0A9BF" font-weight="500" class="">Your query stays yours.</text><rect x="810" y="24" width="360" height="192" rx="16" fill="#161925" stroke="#282D3D"/><rect x="835" y="48" width="150" height="49" rx="8" fill="#222737" stroke="#62628A"/><text x="854" y="80" font-size="22" fill="#FFC24B" font-weight="650" class="mono">RETURN</text><text x="835" y="139" font-size="25" fill="#EDE6D6" font-weight="650" class="">Go</text><text x="835" y="178" font-size="16" fill="#A0A9BF" font-weight="500" class="">Open the selected result.</text></svg>